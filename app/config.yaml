manifest:
  # --- Agents ---

  frontend-dev:
    description: "Frontend specialist: React, Vue, CSS, UI/UX, responsive design, and performance."
    quick_prompts:
      - "Review this React component for best practices"
      - "How should I structure my frontend project?"
      - "Suggest improvements for mobile responsiveness"

  backend-dev:
    description: "Backend specialist: Python APIs, databases, authentication, and scalable architecture."
    quick_prompts:
      - "Design a REST API for my application"
      - "How should I structure my database schema?"
      - "Review this FastAPI endpoint for security"

  devops:
    description: "Infrastructure specialist: Docker, CI/CD, deployment, monitoring, and cloud services."
    quick_prompts:
      - "Write a Dockerfile for my Python app"
      - "Set up a GitHub Actions CI/CD pipeline"
      - "How should I monitor my production services?"

  qa-engineer:
    description: "Quality assurance: test strategy, unit/E2E tests, bug tracking, and test automation."
    quick_prompts:
      - "Write pytest tests for this function"
      - "How should I test this API endpoint?"
      - "Suggest a test strategy for my new feature"

  security-specialist:
    description: "Security expert: vulnerability review, secure coding, authentication, and compliance."
    quick_prompts:
      - "Review this code for security vulnerabilities"
      - "How should I implement JWT authentication securely?"
      - "Check my dependencies for known CVEs"

  docs-writer:
    description: "Technical documentation: README, API docs, architecture guides, and onboarding."
    quick_prompts:
      - "Write a README for my project"
      - "Generate API documentation from my code"
      - "Create an onboarding guide for new developers"

  platform-builder:
    description: "Creates agents, teams, workflows, and schedules using the AgentOS Studio."
    quick_prompts:
      - "What can you build?"
      - "Build an agent for my product — the docs are at docs.agno.com"
      - "Build a daily pulse workflow and schedule it for 9am"

  platform-manager:
    description: "Monitors and manages your AgentOS: usage, tokens, runs, tools, evals and schedules."
    quick_prompts:
      - "Is the platform healthy?"
      - "How many runs and tokens over the last 7 days?"
      - "Which agent is slowest, and is anything failing?"

  platform-engineer:
    description: "Answers codebase questions: reads the source code, explains the wiring, and generates handoffs for your coding agent."
    quick_prompts:
      - "How does learning work?"
      - "How does tool offloading work?"
      - "How does the agno team work?"

  # --- Teams ---

  agno:
    description: "The platform lead. Agno can build agents, run them and check on the platform."
    quick_prompts:
      - "Tell me about yourself"
      - "How do I get started?"
      - "Build an agent for my product, the docs are at docs.agno.com"

  # --- Workflows ---

  deployment-check:
    description: "Readiness check: database, credentials, auth, scheduler, MCP, Slack. No model calls."
    quick_prompts:
      - "Run the deployment check"

  run-evals:
    description: "Runs the eval cases tagged by EVALS_TAG (default: smoke). Disabled by default."
    quick_prompts:
      - "Run the eval suite (spends model calls)"
